name: Local contract and collector checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic core and reference test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts and run existing component tests
        run: python tools/workspace.py verify --output ../ci-verification
      - name: Run eight offline journeys
        run: python tools/workspace.py journeys --output ../ci-journeys
      - name: Explain audit boundary
        run: echo 'Green fixture CI does not mean POC-ready. The unresolved requirements in audits/ run separately and are not xfailed or hidden.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification
          path: |
            ../ci-verification
            ../ci-journeys
